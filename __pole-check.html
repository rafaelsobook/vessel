<!doctype html>
<html><head><meta charset="utf-8"><title>pole check</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222}#c{width:100%;height:100%;display:block}#log{position:absolute;left:6px;top:6px;color:#fff;font:12px monospace;white-space:pre;background:#0008}</style></head>
<body><canvas id="c"></canvas><div id="log"></div>
<script type="module">
// TEMPORARY - Claude's look at the village light poles, delete after
const logEl = document.getElementById("log"); const lines = []
const log = s => { lines.push(s); logEl.textContent = lines.join("\n") }
window.addEventListener("error", e => log("ERR " + e.message))
window.addEventListener("unhandledrejection", e => log("REJ " + (e.reason?.stack || e.reason)))
{
    const html = await (await fetch("/index.html")).text()
    const doc = new DOMParser().parseFromString(html, "text/html")
    doc.querySelectorAll("script, canvas").forEach(s => s.remove())
    const holder = document.createElement("div"); holder.style.display = "none"
    holder.innerHTML = doc.body.innerHTML; document.body.appendChild(holder)
}
const { Engine, Scene, ArcRotateCamera, HemisphericLight, DirectionalLight, Vector3, Color3, Color4, MeshBuilder, StandardMaterial } = await import("@babylonjs/core")
await import("@babylonjs/loaders")
const q = new URLSearchParams(location.search)
const view = q.get("view") || "far"
const time = q.get("night") ? "night" : "day"
const engine = new Engine(document.getElementById("c"), true, { preserveDrawingBuffer: true })
const scene = new Scene(engine)
// the village's own setup (localroomdb village sceneTemp / tools/lighting.js)
scene.createDefaultEnvironment({ createGround: false, createSkybox: false })
scene.clearColor = new Color4(0.45, 0.6, 0.75, 1)
const hemi = new HemisphericLight("hemi_ambient", new Vector3(0, 1, 0), scene); hemi.intensity = time === "night" ? 0.3 : 1
const sun = new DirectionalLight("dir_light", new Vector3(-1, -2, -1), scene); sun.intensity = time === "night" ? 0.12 : 0.9
const ground = MeshBuilder.CreateGround("g", { width: 60, height: 60 }, scene)
const gm = new StandardMaterial("gm", scene); gm.diffuseColor = new Color3(0.3, 0.42, 0.22); gm.specularColor = Color3.Black(); ground.material = gm

// the REAL registry, with only its scene lookup (main.js's getSceneDet) stubbed
window.__scene = scene
let code = await (await fetch("/src/components/assetregistry.js")).text()
const mainImport = code.match(/^import \{[^}]*getSceneDet[^}]*\} from "[^"]*main[^"]*";?$/m)
if(!mainImport) throw new Error("no main.js import found in assetregistry.js")
code = code.replace(mainImport[0], "")
code = code.replace(/getSceneDet\(\)/g, "({ scene: window.__scene })")
code = code.replace(/from "\//g, `from "${location.origin}/`)
// createGrasses.js (imported by the registry) also asks main.js for the scene
const reg = await (async () => {
    const mod = await import(URL.createObjectURL(new Blob([code], { type: "text/javascript" })))
    return mod.getVillageAssetRegistry()
})()
const pole = reg.lightPole
if(!pole){ log("NO POLE LOADED") } else {
    const m = pole.material
    log(`pole mesh "${pole.name}": ${pole.getTotalVertices()} verts, ${pole.subMeshes?.length} submeshes`)
    log(`material: ${m?.getClassName()} "${m?.name}"` + (m?.subMaterials ? ` -> sub: ${m.subMaterials.map(s => `${s?.getClassName()} "${s?.name}" albedoTex=${!!s?.albedoTexture} unlit=${s?.unlit}`).join(" | ")}` : ` albedoTex=${!!m?.albedoTexture} diffuseTex=${!!m?.diffuseTexture} unlit=${m?.unlit}`))
    // spawnProps (createvillage.js) for the poles
    if(pole.material) pole.material.unlit = true
    pole.isVisible = false
    ;[[-1.2, 0, 0], [1.2, 0, 0.5], [0, 0, 4]].forEach((p, i) => {
        const inst = pole.createInstance("pole_" + i)
        inst.position = new Vector3(...p)
        inst.scaling = new Vector3(1, 1, 1)
        inst.freezeWorldMatrix()
    })
    const views = { far: [Math.PI * 1.25, 1.3, 14, [0, 2.3, 0.8]], close: [Math.PI * 1.15, 1.5, 4.2, [-1.2, 3.2, 0]], base: [Math.PI * 1.2, 1.5, 3, [-1.2, 1, 0]], top: [Math.PI * 1.1, 1.2, 3.5, [-1.2, 4, 0]] }
    const v = views[view]
    const cam = new ArcRotateCamera("cam", v[0], v[1], v[2], Vector3.FromArray(v[3]), scene)
    cam.minZ = 0.05
    scene.fogMode = Scene.FOGMODE_EXP; scene.fogColor = new Color3(0.05, 0.15, 0.1); scene.fogDensity = 0.008
}
setInterval(() => { engine.beginFrame(); scene.render(); engine.endFrame() }, 16)
log("done")
</script></body></html>
